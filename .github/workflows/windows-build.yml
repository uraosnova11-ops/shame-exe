name: Windows EXE
on:
  push:
    branches: ["codex/yuri-crm"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install verified registry packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Unit tests
        run: python -m unittest -v test_app.py
      - name: Download official offline WebView2 Runtime
        shell: pwsh
        run: |
          $url = 'https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/63f7af19-5d22-43ab-af18-239a7b23b84c/MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          Invoke-WebRequest $url -OutFile MicrosoftEdgeWebView2RuntimeInstallerX64.exe
          $actual = (Get-FileHash MicrosoftEdgeWebView2RuntimeInstallerX64.exe -Algorithm SHA256).Hash
          if ($actual -ne '47BC51387AFF95C1275CE38CFBBB5FBAB99B43B33214049877BBCDBCC7A970D5') { throw 'Official WebView2 installer hash mismatch' }
      - name: Build windowed executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name YuriCRM --add-data "index.html;." --add-data "desktop.css;." --add-data "desktop.js;." --add-binary "MicrosoftEdgeWebView2RuntimeInstallerX64.exe;." launcher.py
      - name: Smoke test bundled EXE and persisted settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:YURI_DATA_DIR = Join-Path $env:RUNNER_TEMP 'YuriCRM-smoke'
          $env:YURI_PORT = '18787'
          $exe = Join-Path $PWD 'dist\YuriCRM.exe'
          function Start-App {
            $p = Start-Process -FilePath $exe -ArgumentList '--smoke' -WindowStyle Hidden -PassThru
            for ($i=0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod 'http://127.0.0.1:18787/api/state' -TimeoutSec 2
                return @{ Process=$p; State=$response }
              } catch { if ($p.HasExited) { throw 'EXE exited before the interface opened' } }
            }
            throw 'Bundled interface did not open within 30 seconds'
          }
          $first = Start-App
          try {
            if ($first.State.settings.name -ne 'Юрий') { throw 'Profile missing on first launch' }
            $page = Invoke-WebRequest 'http://127.0.0.1:18787/' -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'Первый запуск') { throw 'Wizard not visible' }
            $body = @{name='Юрий';city='Ростов-на-Дону';wizard_step=2;auto=$false} | ConvertTo-Json
            Invoke-RestMethod 'http://127.0.0.1:18787/api/settings' -Method Post -Body $body -ContentType 'application/json' | Out-Null
          } finally { taskkill /T /F /PID $first.Process.Id 2>$null | Out-Null }
          Start-Sleep -Seconds 2
          $second = Start-App
          try {
            if ($second.State.settings.wizard_step -ne 2) { throw 'Settings did not survive restart' }
            if ($null -eq $second.State.settings.vk) { throw 'VK campaign setting missing' }
          } finally { taskkill /T /F /PID $second.Process.Id 2>$null | Out-Null }
      - name: Smoke test graphical startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:YURI_DATA_DIR = Join-Path $env:RUNNER_TEMP 'YuriCRM-gui-smoke'
          $p = Start-Process -FilePath (Join-Path $PWD 'dist\YuriCRM.exe') -ArgumentList '--gui-smoke' -PassThru
          for ($i=0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            if ($p.MainWindowHandle -ne [IntPtr]::Zero) { break }
            if ($p.HasExited) { throw 'EXE exited before native window appeared' }
          }
          if ($p.MainWindowHandle -eq [IntPtr]::Zero -or $p.MainWindowTitle -notlike '*YuriCRM*') { throw 'Native YuriCRM window not found' }
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public class WindowRect {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr handle, out RECT rect);
          }
          '@
          $rect = New-Object WindowRect+RECT
          if (-not [WindowRect]::GetWindowRect($p.MainWindowHandle,[ref]$rect)) { throw 'Cannot read native window bounds' }
          $w = $rect.Right - $rect.Left; $h = $rect.Bottom - $rect.Top
          if ($w -lt 800 -or $h -lt 500) { throw 'Native window has unexpected size' }
          Start-Sleep -Seconds 2
          $bitmap = New-Object System.Drawing.Bitmap($w,$h)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($rect.Left,$rect.Top,0,0,(New-Object System.Drawing.Size($w,$h)))
          $graphics.Dispose()
          $bitmap.Save((Join-Path $PWD 'dist\YuriCRM-window.png'),[System.Drawing.Imaging.ImageFormat]::Png)
          $bitmap.Dispose()
          Wait-Process -Id $p.Id -Timeout 30
          $p.Refresh()
          if ($p.ExitCode -ne 0) { Get-Content (Join-Path $env:YURI_DATA_DIR 'startup-error.txt') -ErrorAction SilentlyContinue; throw 'Graphical startup failed' }
          if (-not (Test-Path (Join-Path $env:YURI_DATA_DIR 'gui-smoke-ok.txt'))) { throw 'Embedded window did not load the UI' }
          $again = Start-Process -FilePath (Join-Path $PWD 'dist\YuriCRM.exe') -ArgumentList '--gui-smoke' -PassThru -Wait
          if ($again.ExitCode -ne 0) { throw 'Embedded window failed on second launch' }
      - uses: actions/upload-artifact@v4
        with:
          name: YuriCRM-Windows-x64
          path: dist/YuriCRM.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: YuriCRM-real-window
          path: dist/YuriCRM-window.png
          if-no-files-found: error

